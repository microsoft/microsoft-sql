name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: catalog structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both directions against the filesystem: a skill added without a manifest
      # entry fails, and a manifest entry claiming to be shipped with nothing
      # behind it fails. That is what keeps the manifest from drifting.
      - name: Structure and manifest parity
        run: node scripts/validate-catalog.mjs

      # The validator against planted bad states: a skill on disk marked planned,
      # and an entry marked shipped with nothing on disk. Both must go red.
      - name: Manifest parity check fails when it should
        run: node --test test/validate-catalog.test.mjs

      # Regenerate every derived surface and fail if anything differs. The
      # pilot maintained llms.txt and four plugin manifests by hand and they
      # drifted; two audits missed them because plugin manifests hide in
      # dot-directories as .json.
      - name: Generated surfaces match a fresh generation
        run: node scripts/generate.mjs --check

      # Regenerates the 17 container sidecars from literals in its own source and
      # compares them against this repository. It is a GENERATOR check. It says
      # nothing at all about the product repository, and must not be read as if
      # it does. The step below is the one that reads the other repository.
      - name: Container sidecars are current
        run: node scripts/backfill-container-sidecars.mjs --check

      # The real cross-repository check. Reads the 17 skills from
      # microsoft/azure-sql-database-container over HTTPS, needs no token
      # because that repository is public, and FAILS rather than skips when it
      # cannot see them. Before this existed, the claim that the two
      # repositories agree was verified by a reviewer once and enforced by
      # nothing, which is the same shape as several other green-while-checking-
      # nothing failures found in this project.
      #
      # THE DIRECTION REVERSED ON 2026-09-20. This repository is now the parent
      # of the 17 azuresql-db-* skills: they are authored, optimised, evaluated
      # and tested here, and the pilot repository receives copies. The copy is ON
      # HOLD until Carlos Robles says go, so the pilot repository is expected to
      # be behind and a difference reports as PENDING SYNC and exits 0. The step
      # still goes red for a defect on this side and for a pilot repository it
      # could not read, which is UNVERIFIED and never OK.
      #
      # catalog/container-parity-debt.jsonc went with the flip. It recorded
      # differences as a debt owed upstream, which only made sense while the
      # pilot repository was the parent; the same information is now the pending
      # copy the script computes on every run.
      - name: The pilot repository's copies, measured against this source
        run: node scripts/check-container-parity.mjs

      # Field ids in the issue form are what the feedback skill fills verbatim.
      - name: Feedback prefill contract
        run: node scripts/check-prefill-contract.mjs

      # APM. This repository shipped a generated, committed, public apm.yml for
      # weeks that supported nothing: `apm pack` reported "nothing to pack"
      # because the manifest declared no targets, used a version that is not a
      # SemVer string, and listed two keys the schema does not have. Nobody had
      # run the tool against it. A manifest whose presence implies support, with
      # no check behind it, is indistinguishable from support until a customer
      # tries to install.
      #
      # The check also guards the thing that would break everyone else: APM
      # resolves a .apm/ directory in preference to root-level skills/, so
      # creating one would shadow the location the Agent Plugins specification
      # pins, with no error anywhere.
      # pip rather than the curl installer, because pip lands on PATH
      # deterministically on a runner and the curl script's install location is
      # not something this workflow should be guessing at.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the APM CLI
        run: |
          pip install apm-cli
          apm --version

      - name: APM package is installable, and still Agent Plugins conformant
        run: node scripts/check-apm.mjs --require-cli

      # Identical to `npm test`. The gate is a script rather than inline YAML so
      # the two cannot drift.
      - name: House rules on the files we author
        run: node scripts/check-house-rules.mjs

      # The skill CONTENT rules, which nothing in this repository used to check.
      # Frontmatter, body budget, reference depth, style, security, scope, the
      # sidecar shape and the value bar all live in a constitution that travels
      # inside the action below. This repository carries no copy of them, which
      # is the point: one place to change a rule, and no second opinion.
      #
      # REPORTING, NOT BLOCKING, and that is a deliberate state rather than an
      # oversight. Pointed at 56 skills that had never been linted, it finds 18
      # error-severity violations across 17 of them, and all 17 are the
      # azuresql-db-* container skills.
      #
      # THE REASON FOR NOT BLOCKING CHANGED ON 2026-09-20 AND IS WEAKER NOW. It
      # used to be that those files came from another repository and could not be
      # fixed from here. This repository is now their parent, so they can be, and
      # the only remaining reason is that turning this red today would block every
      # pull request on 18 findings nobody has worked through yet. That is a
      # backlog, not a boundary, and it should be said as one.
      #
      # The findings are still printed, still written to the job summary, and
      # still annotated on the diff at their real severity, so a green check
      # sits next to red annotations. That pairing says both true things: the
      # gate ran, and the corpus is not clean.
      #
      # TO MAKE IT BLOCK: change fail-on to error. Nothing else changes. What
      # has to happen first is that those 17 skills each gain a sentence giving
      # the date their claims were checked and what they were checked against,
      # and one over-length reference file gains a table of contents. That work
      # now happens in this repository, which authors them. Anything promoted
      # from the workbench arrives already clean, because the workbench runs the
      # same rules before it leaves.
      #
      # The reference resolves with no token because both repositories are
      # private in the same organisation and the gate repository allows access
      # from it. If that setting is ever turned off the reference stops
      # resolving, and the fix is the setting, not a token here.
      - name: Skill content rules
        uses: microsoft/azure-sql-skills-eval@v1
        with:
          paths: skills
          # Without the manifest, the rules about a description naming a
          # neighbouring skill cannot resolve anything and report themselves
          # unchecked. With it, they can tell a shipped skill from a planned one.
          catalog: catalog/catalog.json
          fail-on: never

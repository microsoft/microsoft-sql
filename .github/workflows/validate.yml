name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: catalog structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both directions against the filesystem: a skill added without a manifest
      # entry fails, and a manifest entry claiming to be shipped with nothing
      # behind it fails. That is what keeps the manifest from drifting.
      - name: Structure and manifest parity
        run: node scripts/validate-catalog.mjs

      # Regenerate every derived surface and fail if anything differs. The
      # pilot maintained llms.txt and four plugin manifests by hand and they
      # drifted; two audits missed them because plugin manifests hide in
      # dot-directories as .json.
      - name: Generated surfaces match a fresh generation
        run: node scripts/generate.mjs --check

      - name: Container sidecars are current
        run: node scripts/backfill-container-sidecars.mjs --check

      # Field ids in the issue form are what the feedback skill fills verbatim.
      - name: Feedback prefill contract
        run: node scripts/check-prefill-contract.mjs

      - name: The container family is byte-identical to the pilot
        run: |
          # The 17 carried-over skills must never be edited here. The catalog is
          # their new home, not a fork: the product is in Private Preview until
          # November 2026 and its users install the same files.
          if git log --oneline -1 --name-only -- skills/azure-sql-database-container \
             | grep -qE 'skills/azure-sql-database-container/.*/SKILL\.md'; then
            echo "::warning::a carried-over container SKILL.md changed in this commit. It should not, unless the change came from the product repository."
          fi
          echo "checked"

      - name: House rules on the files we author
        run: |
          # ST007, no em-dashes. Scoped to what this repository authors. The 17
          # carried-over skills are excluded: they are the product's files, and
          # this repository does not get to reformat them.
          # Built from its code point so this file does not trip its own check.
          DASH=$(printf '\u2014')
          if grep -rn "$DASH" scripts catalog README.md AGENTS.md llms.txt apm.yml .github/workflows .github/ISSUE_TEMPLATE; then
            echo "::error::em-dash found. House rule ST007."
            exit 1
          fi
          echo "no em-dashes in authored files"

name: Agent skill feedback
description: Report incorrect, missing, unsafe, or stale guidance in a Microsoft SQL agent skill.
title: "[Skill]: "
labels: ["skills", "needs-triage", "via-skill"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the **agent plugins and skills** published by this repository, not for a database service or agent host.

        If the skill gave correct guidance and the product or host still failed, use that product's support channel. If the skill gave wrong, incomplete, stale, or unsafe guidance, report it here.

        Never paste passwords, connection strings, tokens, customer data, or other secrets.

  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin
      description: Choose the installed bundle. Pick marketplace or installation if no plugin loaded.
      options:
        - microsoft-sql
        - microsoft-azuresqldb-container
        - microsoft-sql-vscode
        - microsoft-sql-migration
        - microsoft-sql-admin
        - microsoft-sql-fdh
        - Marketplace or installation as a whole
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: Which skill
      description: Choose the skill that caused the problem, or the plugin as a whole if discovery failed.
      options:
        - active-connections
        - always-encrypted-columns
        - analyze-readiness-at-scale
        - authentication-diagnostics
        - azure-functions-sql-bindings
        - azure-sql
        - azuresql-db-auth
        - azuresql-db-ci
        - azuresql-db-connections
        - azuresql-db-container
        - azuresql-db-dab
        - azuresql-db-faq
        - azuresql-db-feedback
        - azuresql-db-from-sql-server
        - azuresql-db-functions
        - azuresql-db-import
        - azuresql-db-local-to-cloud
        - azuresql-db-rag
        - azuresql-db-scaffold
        - azuresql-db-schema-migration
        - azuresql-db-seed
        - azuresql-db-sidecar
        - azuresql-db-testing
        - backup-history-azuresql
        - backup-strategy-sqlserver
        - blocking-root-cause-analysis
        - build-app-on-azure-sql
        - bulk-load-and-bulk-copy
        - check-live-blocking
        - code-analysis
        - connect-from-dotnet
        - connect-from-python
        - connect-from-typescript-and-node
        - connect-to-azure-sql
        - connectivity-troubleshoot
        - create-xe-session
        - dab-mcp-endpoint
        - dab-rest-and-graphql
        - database-config-azuresql
        - database-settings-review
        - databasehub-cli
        - deadlock-analysis
        - deadlock-analysis-azuresql
        - deploy-app-to-azure
        - deploy-dab-to-azure
        - design-azure-sql-schema
        - dev-container-templates
        - ef-core-azure-sql
        - embeddings-and-external-models
        - entra-id-auth
        - evaluate-azure-migration-assessment
        - evaluate-offline-migration-readiness
        - generate-migration-prerequisite-plan
        - geo-dr-assessment-health-check
        - get-migration-assessment
        - github-actions-for-sql
        - ha-assessment-health-check
        - health-audit-sqlserver
        - improve-query-performance
        - investigate-geo-dr-issues
        - investigate-ha-issues
        - investigate-sql-cpu-pressure
        - investigate-sql-data-io-pressure
        - investigate-sql-log-io-pressure
        - investigate-sql-memory-issues
        - investigate-statistics-issues
        - langchain-and-llamaindex-on-azure-sql
        - ledger-tables
        - missing-index-analysis
        - partitioned-tables
        - plan-analysis
        - plan-cache-analysis
        - plan-cache-qds-bridge
        - prevent-sql-injection
        - prisma-azure-sql
        - provision-azure-sql-db
        - provision-hyperscale
        - query-hint-tuning
        - query-rewrite
        - query-store-investigation
        - query-store-volatile-historical-slow-queries-comparison
        - rag-local-with-container
        - rag-on-azure-sql
        - read-execution-plan
        - recommend-migration-path
        - recommend-sku-sizing
        - resource-usage-sqlserver
        - restore-and-recover
        - rls-multi-tenant
        - run-migration-assessment
        - schema-design-guidance
        - schema-migrations-safely
        - skill-feedback
        - slow-query-investigation
        - sql-admin-analyze-readiness-at-scale
        - sql-admin-evaluate-azure-migration-assessment
        - sql-admin-get-migration-assessment
        - sql-agent-job-failure-investigator
        - sql-backup-restore-to-azure-sql-vm-migration
        - sql-bacpac-to-azure-sql-db-migration
        - sql-database-projects
        - sql-server-to-sql-mi-lrs-migration
        - sql-tools-mcp-setup
        - sqlalchemy-azure-sql
        - sqlpackage-import-export
        - t-sql-correctness
        - t-sql-json-and-openjson
        - t-sql-upserts-merge
        - table-access-analysis
        - table-health-check
        - top-queries-noqds
        - validate-post-migration-data
        - vector-search-azure-sql
        - wait-category-analysis
        - The plugin as a whole (install, discovery, or wrong skill loaded)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: What kind of problem
      options:
        - The skill told the agent to do something wrong
        - The skill was missing something it needed to say
        - The wrong skill was used, or no skill was used at all
        - The skill would not install or would not load
        - The skill worked, but I want to suggest an improvement
        - Something else
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent or host
      description: Skills and plugin discovery can behave differently across hosts.
      options:
        - Claude Code
        - GitHub Copilot (VS Code)
        - GitHub Copilot (CLI)
        - Codex
        - Cursor
        - Grok Build
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install the plugin or skills
      options:
        - npx skills add
        - GitHub CLI (gh skill install)
        - Claude Code plugin marketplace
        - Committed to .github/skills in my own repository
        - Copied the directories in by hand
        - GitHub Copilot plugin marketplace
        - Codex plugin marketplace
        - Visual Studio Code Agent Plugins marketplace
        - Cursor plugin marketplace
        - Grok local plugin install
        - Copied a plugin or skill directory from a local checkout
        - Preinstalled by the host
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin and host versions
      description: Include the plugin version and agent or host version when available.
      placeholder: "microsoft-sql-vscode 1.0.0; VS Code 1.x; GitHub Copilot Chat 0.x"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Tell us what you asked the agent to do, what you expected, and what it did.
      placeholder: |
        I asked: "add vector search to this table"
        I expected:
        The agent:
    validations:
      required: true

  - type: textarea
    id: skill-said
    attributes:
      label: What the skill said, and what worked instead
      description: Quote the incorrect or missing guidance and explain the verified alternative. Redact sensitive data.
      placeholder: |
        The skill said:
        What actually worked:

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the prompt and relevant commands. Redact credentials, connection strings, customer data, and secrets.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include operating system, database product and version, logs, or screenshots when relevant.

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is about a plugin or agent skill published by this repository.
          required: true
        - label: I removed passwords, connection strings, tokens, customer data, and other secrets.
          required: true

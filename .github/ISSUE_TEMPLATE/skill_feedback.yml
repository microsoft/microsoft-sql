name: Agent skill feedback
description: Report a problem with an Azure SQL agent skill, or suggest an improvement to one. For problems with Azure SQL Database itself, use the product feedback channels instead.
title: "[Skill]: "
labels: ["skills", "needs-triage", "via-skill"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the **agent skills** in this catalog: the instructions your AI agent loads from this repository, not the Azure SQL Database service itself.

        Rule of thumb: if the skill told your agent to do the right thing and it still failed, that is a product issue and belongs in the Azure SQL Database feedback channels instead. If the skill told your agent to do the *wrong* thing, or did not tell it enough, that is a skill issue and it belongs here.

        Pick your skill from the dropdown below; it is grouped by domain, the same grouping used in this repository's README. If your report is about installing the collection, or the wrong skill loading, pick "The collection as a whole" instead of guessing at a skill.

  - type: dropdown
    id: skill
    attributes:
      label: Which skill
      description: The skill that caused the problem, grouped by domain. Pick "The collection as a whole" for install problems or for a skill that never loaded.
      options:
        # BEGIN GENERATED SKILL OPTIONS
        # GENERATED by scripts/generate.mjs from catalog/catalog.json. Do not edit by hand; the parity gate will fail.
        - "-- Provisioning and local dev --"
        - dev-container-templates
        - provision-azure-sql-db
        - provision-hyperscale
        - "-- Drivers and connectivity --"
        - connect-from-dotnet
        - connect-from-python
        - connect-from-typescript-and-node
        - connect-to-azure-sql
        - diagnose-connection-errors
        - "-- Schema and ORM --"
        - design-azure-sql-schema
        - ef-core-azure-sql
        - prisma-azure-sql
        - sqlalchemy-azure-sql
        - "-- T-SQL correctness and patterns --"
        - t-sql-correctness
        - t-sql-json-and-openjson
        - t-sql-upserts-merge
        - "-- Identity and access (Entra ID) --"
        - entra-id-auth
        - "-- Security and safe SQL --"
        - prevent-sql-injection
        - rls-multi-tenant
        - "-- Schema change and CI/CD --"
        - github-actions-for-sql
        - schema-migrations-safely
        - sql-database-projects
        - "-- Azure patterns and deploy --"
        - deploy-app-to-azure
        - "-- APIs and application patterns --"
        - azure-functions-sql-bindings
        - build-app-on-azure-sql
        - dab-rest-and-graphql
        - "-- AI, vector and RAG --"
        - embeddings-and-external-models
        - langchain-and-llamaindex-on-azure-sql
        - rag-local-with-container
        - rag-on-azure-sql
        - vector-search-azure-sql
        - "-- Performance and diagnostics --"
        - capture-with-extended-events
        - diagnose-blocking-and-deadlocks
        - diagnose-resource-pressure
        - diagnose-slow-query
        - read-execution-plan
        - "-- Operate and recover --"
        - restore-and-recover
        - "-- Data movement --"
        - bulk-load-and-bulk-copy
        - sqlpackage-import-export
        - "-- Azure SQL Database container --"
        - azuresql-db-auth
        - azuresql-db-ci
        - azuresql-db-connections
        - azuresql-db-container
        - azuresql-db-dab
        - azuresql-db-faq
        - azuresql-db-feedback
        - azuresql-db-from-sql-server
        - azuresql-db-functions
        - azuresql-db-import
        - azuresql-db-local-to-cloud
        - azuresql-db-rag
        - azuresql-db-scaffold
        - azuresql-db-schema-migration
        - azuresql-db-seed
        - azuresql-db-sidecar
        - azuresql-db-testing
        - "-- Docs and feedback --"
        - azure-sql
        - skill-feedback
        - The collection as a whole (install, discovery, or the wrong skill loaded)
        - Not sure
        # END GENERATED SKILL OPTIONS
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: What kind of problem
      options:
        - The skill told the agent to do something wrong
        - The skill was missing something it needed to say
        - The wrong skill was used, or no skill was used at all
        - The skill would not install or would not load
        - The skill worked, but I want to suggest an improvement
        - Something else
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      description: Skills behave differently across harnesses, and we cannot see which one you used.
      options:
        - Claude Code
        - GitHub Copilot (VS Code)
        - GitHub Copilot (CLI)
        - Codex
        - Cursor
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install the skills
      options:
        - npx skills add
        - GitHub CLI (gh skill install)
        - Claude Code plugin marketplace
        - Committed to .github/skills in my own repository
        - Copied the directories in by hand
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked your agent to do, and what it did.
      placeholder: |
        I asked: "add vector search to this table"
        The agent ...
    validations:
      required: true

  - type: textarea
    id: skill-said
    attributes:
      label: What the skill said, and what you had to do instead
      description: |
        This is the most useful thing you can tell us, and the thing we are otherwise blind to. If the agent followed the skill and it did not work, quote the instruction that was wrong or missing, and say what actually worked. If the agent had to improvise or work around the skill, tell us what it worked around.
      placeholder: |
        The skill said to run:      CAST(? AS VECTOR(1536))
        What actually worked:       CAST(CAST(? AS NVARCHAR(MAX)) AS VECTOR(1536))
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The prompt you gave the agent, and the commands it ran. Redact any password, connection string, or credential before pasting.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Skill version, host OS, or anything else that matters. Optional.

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is about an agent skill, not about Azure SQL Database itself.
          required: true
        - label: I removed any password, connection string, or credential from what I pasted above.
          required: true
